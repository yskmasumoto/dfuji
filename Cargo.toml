[workspace] # プロジェクト全体を管理するCargoワークスペースの宣言
members = [ # このワークスペースに含めるクレート一覧
    "core", # 定数や構造体を集約したコアライブラリクレート
    "geo",  # 地理座標計算のライブラリクレート
    "sun",  # 太陽位置計算のライブラリクレート
    "app",  # ダイヤモンド富士計算のメインアプリケーションクレート
    "cli",  # clapベースでdfuji-appライブラリを呼び出すCLIクレート
]
resolver = "2" # 依存解決アルゴリズムとしてRust推奨の第2世代リゾルバを使用

[workspace.metadata]
rust-analyzer = { linkedProjects = ["app/Cargo.toml", "cli/Cargo.toml", "core/Cargo.toml", "geo/Cargo.toml", "sun/Cargo.toml"] } # rust-analyzerにワークスペース内のクレートを認識させる設定
