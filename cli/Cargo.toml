[package] # CLIクレート自体のメタデータ定義
name = "dfuji-cli" # CLIバイナリのクレート名
description = "ダイヤモンド富士の観測可能性を計算する CLI ツール"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies] # CLIで利用する依存クレート
clap = { version = "^4.5", features = ["derive"] } # コマンドライン引数処理のためにclapを導入
tracing = "^0.1.41" # ログ出力用にライブラリと同じtracingを使用
tracing-subscriber = { version = "^0.3.20", features = [
    "fmt",
    "env-filter",
] } # tracingログを表示するためのサブスクライバ
chrono = "^0.4.42" # 結果表示やフォーマットで日時を扱うための補助（必要に応じて利用）
dfuji-app = { path = "../app" } # dfuji-appライブラリクレートをローカルパス依存として参照
colored = "^3.0.0"
